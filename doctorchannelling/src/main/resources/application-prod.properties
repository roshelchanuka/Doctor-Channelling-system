# application-prod.properties (Production Environment)

# Database Connection (Production SQL Server - Variables MUST be provided by the environment)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Settings for Prod - strictly validate, NO automatic updates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Security Configuration for Prod - Secret MUST be provided by environment
jwt.secret=${JWT_SECRET}
