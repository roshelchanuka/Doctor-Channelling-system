
server.port=8085

# Database Connection Configuration
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DoctorChannellingDB;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
 
# Additional Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# JPA / Hibernate Settings
# Note: For production, change 'update' to 'validate' or 'none' and use a migration tool like Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true

# Security Configuration
jwt.secret=${JWT_SECRET:your_super_secret_key_for_doctor_channelling_system_jwt_that_must_be_changed_in_prod}

# Application CORS Settings
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
