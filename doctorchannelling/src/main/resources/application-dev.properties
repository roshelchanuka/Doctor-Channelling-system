# application-dev.properties (Development Environment)

# Database Connection (Local SQL Server)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=DoctorChannellingDB;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate Settings for Dev
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Configuration for Dev
jwt.secret=${JWT_SECRET:your_super_secret_key_for_doctor_channelling_system_jwt_that_must_be_changed_in_prod}
